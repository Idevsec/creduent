name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test and analysis tools
        run: python -m pip install --upgrade pip pytest ruff bandit

      - name: Run automated test suite
        run: python -m pytest -v

      - name: Run linter (ruff)
        run: |
          ruff check --select E9,F63,F7,F82 api cli mcp registry tests
          ruff check tests

      - name: Run static security analysis (bandit)
        run: bandit -r api cli mcp registry -ll
